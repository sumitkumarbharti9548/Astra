<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Student Notes Hub — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root{--bg:#07070a;--card:#0f1115;--muted:#9aa4b2;--accent:#7c5cff;--glass:rgba(255,255,255,0.03)}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:'Poppins',sans-serif;background:radial-gradient(1000px 500px at 10% 12%,rgba(124,92,255,0.12),transparent),radial-gradient(800px 400px at 92% 88%,rgba(0,180,255,0.05),transparent),var(--bg);color:#e6eef8;overflow:hidden}
    header{position:fixed;left:20px;top:18px;z-index:80;display:flex;align-items:center;gap:12px}
    header .logo{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,0.04)}
    header h1{font-family:'Montserrat';font-size:1rem;margin:0}
    .blobs{position:fixed;inset:0;pointer-events:none;z-index:0}
    .blob{position:absolute;filter:blur(44px);opacity:0.85;border-radius:50%;mix-blend-mode:screen}
    .blob.b1{width:420px;height:420px;left:-120px;top:-120px;background:linear-gradient(135deg,var(--accent),#2dd4bf)}
    .blob.b2{width:380px;height:380px;right:-80px;bottom:-80px;background:linear-gradient(135deg,#00b4ff,#7c5cff)}
    canvas#particles{position:fixed;left:0;top:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0.18}
    .form-container{background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);border:1px solid rgba(255,255,255,0.04);border-radius:16px;padding:36px;max-width:420px;width:100%;backdrop-filter:blur(10px);box-shadow:0 20px 40px rgba(0,0,0,0.4);position:relative;z-index:10}
    .form-title{font-family:'Montserrat';font-size:1.8rem;margin-bottom:8px;color:#fff;text-align:center}
    .form-subtitle{color:var(--muted);margin-bottom:28px;text-align:center;font-size:0.9rem}
    .form-group{margin-bottom:20px;position:relative}
    .form-label{display:block;margin-bottom:8px;color:#e6eef8;font-size:0.875rem;font-weight:600}
    .input-wrap{position:relative}
    .input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:0.9rem;pointer-events:none}
    .form-input{width:100%;padding:12px 16px 12px 40px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:#e6eef8;font-family:'Poppins';font-size:1rem;transition:all .28s}
    .form-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,92,255,0.2)}
    .form-input.error{border-color:#ff5c8d;box-shadow:0 0 0 2px rgba(255,92,141,0.2)}
    .field-error{color:#ff5c8d;font-size:0.78rem;margin-top:5px}
    .form-submit{width:100%;padding:14px;background:linear-gradient(90deg,var(--accent),#00b4ff);border:none;border-radius:10px;color:#071022;font-family:'Montserrat';font-weight:700;font-size:1rem;cursor:pointer;transition:all .28s;position:relative;overflow:hidden}
    .form-submit:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px rgba(124,92,255,0.3)}
    .form-submit:disabled{opacity:0.7;cursor:not-allowed}
    .spinner{display:none;width:18px;height:18px;border:2px solid rgba(7,16,34,0.3);border-top-color:#071022;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    .btn-text{transition:opacity .2s}
    .form-footer{text-align:center;margin-top:20px;color:var(--muted);font-size:0.9rem}
    .form-link{color:var(--accent);text-decoration:none;cursor:pointer}
    .form-link:hover{text-decoration:underline}
    .center-content{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:10}
    .back-btn{position:fixed;right:20px;top:18px;z-index:80;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);padding:8px 16px;border-radius:10px;color:#e6eef8;font-size:0.9rem;cursor:pointer;transition:all .28s;text-decoration:none;display:flex;align-items:center;gap:6px}
    .back-btn:hover{background:rgba(124,92,255,0.1);transform:translateY(-2px)}
    .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:0.85rem}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.08)}
    .demo-btn{width:100%;padding:11px;background:transparent;border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#e6eef8;font-family:'Poppins';font-size:0.9rem;cursor:pointer;transition:all .28s}
    .demo-btn:hover{background:rgba(255,255,255,0.05)}
  </style>
</head>
<body>
  <div class="blobs"><div class="blob b1"></div><div class="blob b2"></div></div>
  <canvas id="particles"></canvas>
  <header>
    <div class="logo"><i class="fas fa-book-open" style="color:var(--accent)"></i><h1>Student Notes Hub</h1></div>
  </header>
  <a class="back-btn" href="index.html"><i class="fas fa-arrow-left"></i> Home</a>

  <div class="center-content">
    <div class="form-container">
      <h2 class="form-title">Welcome Back</h2>
      <p class="form-subtitle">Sign in to access your study tools</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-wrap">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="email" class="form-input" placeholder="your.email@example.com" autocomplete="email">
          </div>
          <div class="field-error" id="emailErr"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="password" class="form-input" placeholder="Enter your password" autocomplete="current-password">
          </div>
          <div class="field-error" id="passErr"></div>
        </div>
        <button type="submit" class="form-submit" id="submitBtn">
          <span class="btn-text">Sign In</span>
          <div class="spinner" id="spinner"></div>
        </button>
      </form>

      <div class="divider">or</div>
      <button class="demo-btn" onclick="demoLogin()"><i class="fas fa-flask"></i> Try Demo Account</button>

      <div class="form-footer">
        Don't have an account? <a class="form-link" href="signup.html">Sign up free</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Redirect if already logged in
    Auth.redirectIfLoggedIn();

    // Particles
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
    addEventListener('resize',resize);resize();
    const pts=Array.from({length:70},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.6+0.4,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25}));
    function tick(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;ctx.beginPath();ctx.fillStyle='rgba(180,200,255,0.04)';ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}requestAnimationFrame(tick)}tick();

    function setLoading(loading) {
      const btn = document.getElementById('submitBtn');
      const text = btn.querySelector('.btn-text');
      const spinner = document.getElementById('spinner');
      btn.disabled = loading;
      text.style.display = loading ? 'none' : 'block';
      spinner.style.display = loading ? 'block' : 'none';
    }

    function clearErrors() {
      ['emailErr','passErr'].forEach(id => document.getElementById(id).textContent = '');
      ['email','password'].forEach(id => document.getElementById(id).classList.remove('error'));
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      clearErrors();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      let valid = true;

      if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
        document.getElementById('emailErr').textContent = 'Enter a valid email address';
        document.getElementById('email').classList.add('error');
        valid = false;
      }
      if (!password || password.length < 6) {
        document.getElementById('passErr').textContent = 'Password must be at least 6 characters';
        document.getElementById('password').classList.add('error');
        valid = false;
      }
      if (!valid) return;

      setLoading(true);
      try {
        const data = await API.login({ email, password });
        Auth.setSession(data.token, data.user);
        showToast(`Welcome back, ${data.user.name}! 🎉`, 'success');
        setTimeout(() => window.location.href = 'index.html', 800);
      } catch (err) {
        showToast(err.message || 'Login failed', 'error');
      } finally {
        setLoading(false);
      }
    });

    async function demoLogin() {
      document.getElementById('email').value = 'demo@studentnoteshub.com';
      document.getElementById('password').value = 'demo123456';
      document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    }
  </script>
</body>
</html>
